name: CredNexus production

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment midway through a schema migration or container update.
concurrency:
  group: crednexus-production
  cancel-in-progress: false

jobs:
  project-tests:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/backend-ci.yml

  ml-tests:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [project-tests, ml-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            target: ''
          - component: frontend
            context: frontend
            target: ''
          - component: ml
            context: ml-service
            target: ml
          - component: minio
            context: infrastructure/minio
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bogdanpryadko4853/crednexus-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BogdanPryadko4853/crednexus
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.component }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.155.212.216.26.sslip.io
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy exact SHA over restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing production DEPLOY_HOST secret}"
          : "${DEPLOY_SSH_KEY:?Missing production DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing production DEPLOY_KNOWN_HOSTS secret}"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/crednexus-key.XXXXXX")
          hosts=$(mktemp "$RUNNER_TEMP/crednexus-hosts.XXXXXX")
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh -i "$key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            "deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_ID"
      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://app.155.212.216.26.sslip.io/healthz
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://auth.155.212.216.26.sslip.io/realms/crednexus/.well-known/openid-configuration >/dev/null
