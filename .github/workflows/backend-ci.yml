name: Project CI

on:
  workflow_call:
  push:
    branches-ignore: [develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "compose.prod.yaml"
      - "infrastructure/minio/**"
      - "infrastructure/deploy/**"
      - "infrastructure/caddy/**"
      - "infrastructure/keycloak/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "compose.prod.yaml"
      - "infrastructure/minio/**"
      - "infrastructure/deploy/**"
      - "infrastructure/caddy/**"
      - "infrastructure/keycloak/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate production deployment configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder
          KEYCLOAK_DB_PASSWORD: ci-placeholder
          KEYCLOAK_ADMIN_PASSWORD: ci-placeholder
          KEYCLOAK_DEMO_ADMIN_PASSWORD: ci-placeholder
          KEYCLOAK_DEMO_EMPLOYEE_PASSWORD: ci-placeholder
          KEYCLOAK_DEMO_CLIENT_PASSWORD: ci-placeholder
          MINIO_ROOT_USER: ci-placeholder
          MINIO_ROOT_PASSWORD: ci-placeholder
          IMAGE_NAMESPACE: ghcr.io/bogdanpryadko4853
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for script in infrastructure/deploy/*.sh; do bash -n "$script"; done
          docker compose -f compose.prod.yaml config --format json | python3 infrastructure/deploy/validate-compose.py

      - name: Build MinIO from official source
        run: docker compose build minio

      - name: Build and run all tests (PostgreSQL and MinIO)
        working-directory: backend
        env:
          CREDNEXUS_TEST_MINIO_IMAGE: crednexus-minio:local
        run: ./gradlew --no-daemon clean build

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          if-no-files-found: ignore

  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 11
        run: npm install --global npm@11.21.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
