version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Pause scheduled version PRs; keep security alerts managed separately.
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /ml-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /ml-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
