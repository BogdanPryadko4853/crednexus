name: crednexus-production

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crednexus}
      POSTGRES_USER: ${POSTGRES_USER:-crednexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_KEYCLOAK_DATABASE: keycloak
      POSTGRES_KEYCLOAK_USERNAME: keycloak
      POSTGRES_KEYCLOAK_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/01-create-keycloak-database.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    <<: *service
    image: quay.io/keycloak/keycloak:26.7.3
    mem_limit: 1g
    command: [start, --import-realm]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-platform-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://auth.155.212.216.26.sslip.io
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx640m
      KEYCLOAK_DEMO_ADMIN_PASSWORD: ${KEYCLOAK_DEMO_ADMIN_PASSWORD:?Set KEYCLOAK_DEMO_ADMIN_PASSWORD}
      KEYCLOAK_DEMO_EMPLOYEE_PASSWORD: ${KEYCLOAK_DEMO_EMPLOYEE_PASSWORD:?Set KEYCLOAK_DEMO_EMPLOYEE_PASSWORD}
      KEYCLOAK_DEMO_CLIENT_PASSWORD: ${KEYCLOAK_DEMO_CLIENT_PASSWORD:?Set KEYCLOAK_DEMO_CLIENT_PASSWORD}
    ports:
      - 127.0.0.1:18081:8080
    volumes:
      - ./infrastructure/keycloak/realm/crednexus-prod-realm.json:/opt/keycloak/data/import/crednexus-realm.json:ro
      - ./infrastructure/keycloak/themes/crednexus:/opt/keycloak/themes/crednexus:ro
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  minio:
    <<: *service
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/crednexus-minio:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: 768m
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/crednexus-minio:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: 'no'
    logging: *logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-crednexus-documents}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

  ml:
    <<: *service
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/crednexus-ml:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      CREDNEXUS_DEVICE: cpu
      CREDNEXUS_MODEL_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
    healthcheck:
      test: [CMD, python, -m, crednexus_ml.healthcheck, http]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  backend:
    <<: *service
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/crednexus-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crednexus}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-crednexus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: https://auth.155.212.216.26.sslip.io/realms/crednexus
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/crednexus/protocol/openid-connect/certs
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${MINIO_BUCKET:-crednexus-documents}
      DOCUMENT_MAX_SIZE_BYTES: '10485760'
      SCORING_PROVIDER: ml
      CREDNEXUS_ML_BASE_URL: http://ml:8000
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  frontend:
    <<: *service
    image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/crednexus-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:18080:8080
    environment:
      FRONTEND_BACKEND_ORIGIN: http://backend:8080
      VITE_API_BASE_URL: /api
      VITE_KEYCLOAK_URL: https://auth.155.212.216.26.sslip.io
      VITE_KEYCLOAK_REALM: crednexus
      VITE_KEYCLOAK_CLIENT_ID: crednexus-frontend
      VITE_APP_LOCALE: ru

volumes:
  postgres-data:
    name: crednexus-production-postgres
  minio-data:
    name: crednexus-production-minio
