name: crednexus

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crednexus}
      POSTGRES_USER: ${POSTGRES_USER:-crednexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crednexus}
      POSTGRES_KEYCLOAK_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_KEYCLOAK_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_KEYCLOAK_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/01-create-keycloak-database.sql:/docker-entrypoint-initdb.d/01-create-keycloak-database.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_TEST_ADMIN_PASSWORD: ${KEYCLOAK_TEST_ADMIN_PASSWORD:-ChangeMe123!}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infrastructure/keycloak/realm/crednexus-realm.json:/opt/keycloak/data/import/crednexus-realm.json:ro
      - ./infrastructure/keycloak/themes/crednexus:/opt/keycloak/themes/crednexus:ro

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-crednexus-documents}
    entrypoint: >
      /bin/sh -c 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
      mc mb --ignore-existing local/"$${MINIO_BUCKET}"'

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crednexus}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-crednexus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-crednexus}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/crednexus}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/crednexus/protocol/openid-connect/certs
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      STORAGE_S3_BUCKET: ${MINIO_BUCKET:-crednexus-documents}
      DOCUMENT_MAX_SIZE_BYTES: ${DOCUMENT_MAX_SIZE_BYTES:-10485760}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-node:24.22.1-alpine3.24}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-nginx:1.30.6-alpine3.24}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    depends_on:
      backend:
        condition: service_started
    environment:
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-8080}
      FRONTEND_BACKEND_ORIGIN: ${FRONTEND_BACKEND_ORIGIN:-http://backend:8080}
      FRONTEND_BACKEND_API_PATH: ${FRONTEND_BACKEND_API_PATH:-/api}
      FRONTEND_PROXY_CONNECT_TIMEOUT: ${FRONTEND_PROXY_CONNECT_TIMEOUT:-5s}
      FRONTEND_PROXY_READ_TIMEOUT: ${FRONTEND_PROXY_READ_TIMEOUT:-60s}
      FRONTEND_DNS_RESOLVER: ${FRONTEND_DNS_RESOLVER:-127.0.0.11}
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
      VITE_APP_LOCALE: ${VITE_APP_LOCALE:-ru}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_CURRENT_USER_PATH: ${VITE_CURRENT_USER_PATH:-/users/me}
      VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-crednexus}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-crednexus-frontend}
      VITE_TOKEN_MIN_VALIDITY_SECONDS: ${VITE_TOKEN_MIN_VALIDITY_SECONDS:-30}
      VITE_AUTH_TIMEOUT_MS: ${VITE_AUTH_TIMEOUT_MS:-20000}
      VITE_COMPANY_MAX_LENGTH: ${VITE_COMPANY_MAX_LENGTH:-255}
      VITE_COMMENT_MAX_LENGTH: ${VITE_COMMENT_MAX_LENGTH:-500}
      VITE_AMOUNT_INTEGER_DIGITS: ${VITE_AMOUNT_INTEGER_DIGITS:-17}
      VITE_AMOUNT_FRACTION_DIGITS: ${VITE_AMOUNT_FRACTION_DIGITS:-2}
      VITE_LEGAL_INN_DIGITS: ${VITE_LEGAL_INN_DIGITS:-10}
      VITE_SOLE_INN_DIGITS: ${VITE_SOLE_INN_DIGITS:-12}
      VITE_FINANCING_PURPOSES: ${VITE_FINANCING_PURPOSES:-working-capital,equipment}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-8080}"

volumes:
  postgres-data:
  minio-data:
